<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FarmGuard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-header">
        <a href="index.html" class="logo">
          <!--<div class="logo-icon">🌾</div>-->
          <div class="logo-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L4 5V10C4 15 7.5 19.5 12 22C16.5 19.5 20 15 20 10V5L12 2Z"/>
            </svg>
          </div>
          <span>FarmGuard</span>
        </a>
        <h1>Welcome back</h1>
        <p>Sign in to access your dashboard</p>
      </div>
      
      <div class="login-card">
        <!-- Status Alert Container -->
        <div id="statusAlertBox" style="display: none; padding: 1rem 1.25rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem;">
          <div id="statusAlertTitle" style="font-weight: 700; margin-bottom: 0.25rem;"></div>
          <div id="statusAlertMessage"></div>
          <div id="statusAlertAction" style="margin-top: 0.75rem; display: none;"></div>
        </div>

        <div class="role-tabs">
          <button class="role-tab active" data-role="farmer" onclick="switchRole('farmer')">
            👨‍🌾 Farmer
          </button>
          <button class="role-tab" data-role="vet" onclick="switchRole('vet')">
            👨‍⚕️ Veterinarian
          </button>
          <button class="role-tab" data-role="authority" onclick="switchRole('authority')">
            🏛️ Authority
          </button>
        </div>
        
        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="identifier" id="identifierLabel">Farmer ID / Mobile / Email</label>
            <input type="text" id="identifier" placeholder="Enter your ID, mobile number, or email" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          
          <div class="form-row">
            <label class="checkbox-group">
              <input type="checkbox" id="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
        </form>
        
        <div class="login-footer">
          <p style="margin-bottom: 0.5rem;"><button type="button" onclick="openCheckStatusModal()" style="background: none; border: none; color: var(--primary); font-size: 0.875rem; text-decoration: underline; font-weight: 600; cursor: pointer;">🔍 Check Registration Status</button></p>
          <p>Don't have an account? <a href="signup.html" style="font-weight: 600; color: var(--primary);">Sign Up</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Check Registration Status -->
  <div id="modalCheckStatus" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: var(--card); border-radius: var(--radius); max-width: 480px; width: 100%; box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 1.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="font-size: 1.15rem; color: var(--foreground);">🔍 Check Registration Status</h3>
        <button onclick="closeCheckStatusModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1rem;">
        Enter your registered email address or phone number to verify your account registration status.
      </p>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="checkStatusQuery">Registered Email or Phone *</label>
        <input type="text" id="checkStatusQuery" placeholder="e.g. name@example.com or 9876543210" style="width: 100%; padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--border);">
      </div>
      <button type="button" class="btn btn-primary" onclick="performCheckStatus()" style="width: 100%; margin-bottom: 1rem;">
        Check Status
      </button>
      <div id="checkStatusResult" style="display: none;"></div>
    </div>
  </div>

  <script>
    const roleConfig = {
      farmer: {
        label: 'Farmer ID / Mobile Number / Email',
        placeholder: 'Enter your ID, mobile number, or email',
        redirect: 'farmer-dashboard.html'
      },
      vet: {
        label: 'Veterinarian License Number / Email',
        placeholder: 'Enter your license number or email',
        redirect: 'vet-dashboard.html'
      },
      authority: {
        label: 'Authority ID / Email',
        placeholder: 'Enter your official ID or email',
        redirect: 'authority-dashboard.html'
      }
    };

    let currentRole = 'farmer';

    function switchRole(role) {
      currentRole = role;
      
      // Update tabs
      document.querySelectorAll('.role-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.role === role);
      });
      
      // Update form
      const config = roleConfig[role];
      document.getElementById('identifierLabel').textContent = config.label;
      document.getElementById('identifier').placeholder = config.placeholder;
      hideAlert();
    }

    function showAlert(type, title, message, actionHtml = null) {
      const box = document.getElementById('statusAlertBox');
      const titleEl = document.getElementById('statusAlertTitle');
      const msgEl = document.getElementById('statusAlertMessage');
      const actionEl = document.getElementById('statusAlertAction');

      box.style.display = 'block';
      titleEl.textContent = title;
      msgEl.textContent = message;

      if (type === 'warning' || type === 'PENDING') {
        box.style.background = '#fff8e1';
        box.style.border = '1px solid #ffe082';
        box.style.color = '#7f5f00';
      } else if (type === 'danger' || type === 'REJECTED') {
        box.style.background = '#ffebee';
        box.style.border = '1px solid #ffcdd2';
        box.style.color = '#c62828';
      } else if (type === 'info' || type === 'CORRECTION_REQUESTED') {
        box.style.background = '#e3f2fd';
        box.style.border = '1px solid #bbdefb';
        box.style.color = '#1565c0';
      } else if (type === 'success' || type === 'APPROVED') {
        box.style.background = '#f0fdf4';
        box.style.border = '1px solid #86efac';
        box.style.color = '#166534';
      }

      if (actionHtml) {
        actionEl.innerHTML = actionHtml;
        actionEl.style.display = 'block';
      } else {
        actionEl.style.display = 'none';
      }
    }

    function hideAlert() {
      document.getElementById('statusAlertBox').style.display = 'none';
    }

    function openCheckStatusModal() {
      document.getElementById('checkStatusQuery').value = '';
      document.getElementById('checkStatusResult').style.display = 'none';
      document.getElementById('modalCheckStatus').style.display = 'flex';
    }

    function closeCheckStatusModal() {
      document.getElementById('modalCheckStatus').style.display = 'none';
    }

    async function performCheckStatus() {
      const query = document.getElementById('checkStatusQuery').value.trim();
      const resDiv = document.getElementById('checkStatusResult');
      if (!query) {
        alert('Please enter your registered email address or phone number.');
        return;
      }
      resDiv.style.display = 'block';
      resDiv.style.cssText = 'display: block; background: var(--muted); padding: 1rem; border-radius: var(--radius); font-size: 0.875rem;';
      resDiv.innerHTML = 'Searching registration status...';

      try {
        const res = await fetch('/api/check-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, role: currentRole })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          let badgeClass = 'badge-warning';
          let bgStyle = 'background: #fff8e1; border: 1px solid #ffe082; color: #7f5f00;';
          if (data.status === 'APPROVED') {
            badgeClass = 'badge-success';
            bgStyle = 'background: #f0fdf4; border: 1px solid #86efac; color: #166534;';
          } else if (data.status === 'REJECTED') {
            badgeClass = 'badge-danger';
            bgStyle = 'background: #ffebee; border: 1px solid #ffcdd2; color: #c62828;';
          } else if (data.status === 'CORRECTION_REQUESTED') {
            badgeClass = 'badge-info';
            bgStyle = 'background: #e3f2fd; border: 1px solid #bbdefb; color: #1565c0;';
          }

          let actionHtml = '';
          if (data.status === 'APPROVED') {
            actionHtml = `<div style="margin-top: 0.75rem;"><button class="btn btn-primary btn-sm" onclick="closeCheckStatusModal(); document.getElementById('identifier').value='${data.email || data.phone}';">Sign In Now</button></div>`;
          } else if (data.status === 'CORRECTION_REQUESTED') {
            actionHtml = `<div style="margin-top: 0.75rem;"><a href="signup.html?resubmit=true&user_id=${data.user_id}" class="btn btn-primary btn-sm">Update & Resubmit</a></div>`;
          }

          resDiv.style.cssText = bgStyle + ' padding: 1rem; border-radius: var(--radius); font-size: 0.875rem;';
          resDiv.innerHTML = `
            <div style="font-weight: 700; margin-bottom: 0.25rem;">Applicant: ${data.name} (${data.role.toUpperCase()})</div>
            <div style="margin-bottom: 0.5rem;"><strong>Status:</strong> <span class="badge ${badgeClass}">${data.status}</span></div>
            <div>${data.message}</div>
            ${actionHtml}
          `;
        } else {
          resDiv.style.cssText = 'background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 1rem; border-radius: var(--radius); font-size: 0.875rem;';
          resDiv.innerHTML = `<div>❌ ${data.message || 'Account not found.'}</div>`;
        }
      } catch (err) {
        resDiv.style.cssText = 'background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 1rem; border-radius: var(--radius); font-size: 0.875rem;';
        resDiv.innerHTML = `<div>Error checking status. Please try again.</div>`;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();
      
      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            identifier: identifier,
            password: password,
            role: currentRole
          })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          const config = roleConfig[currentRole];
          window.location.href = config.redirect;
        } else if (data.status === 'PENDING') {
          showAlert('PENDING', '⏳ Registration Pending', 'Your registration is pending Authority verification.');
        } else if (data.status === 'REJECTED') {
          showAlert('REJECTED', '❌ Registration Rejected', data.message || 'Your registration was rejected by Authority.');
        } else if (data.status === 'CORRECTION_REQUESTED') {
          const userId = data.user ? data.user.id : '';
          const actionBtnHtml = `<a href="signup.html?resubmit=true&user_id=${userId}" class="btn btn-primary btn-sm">✏️ Update & Resubmit Details</a>`;
          showAlert('CORRECTION_REQUESTED', '⚠️ Correction Requested', data.message || 'Authority requested corrections for your registration.', actionBtnHtml);
        } else {
          showAlert('danger', 'Sign In Failed', data.message || 'Invalid credentials. Please try again.');
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('danger', 'Connection Error', 'Login failed. Please check your connection and try again.');
      }
    });
  </script>
</body>
</html>
